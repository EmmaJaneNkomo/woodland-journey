<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woodland Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F5F0E2;--card:#FFFDF6;--ink:#3B3226;--mute:#6E6552;--moss:#5B7B49;--moss-d:#3F5A33;--moss2:#E3E9D0;--bark:#6B4A2F;--berry:#B05A5A;--line:#CDBF9F;--w1:rgba(150,180,120,.30);--w2:rgba(140,175,205,.28);--w3:rgba(205,170,110,.24);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B211A;--card:#242C22;--ink:#EDE7D6;--mute:#A9AE9A;--moss:#9BBF86;--moss-d:#C5DDB4;--moss2:#2F3A2B;--bark:#D2AE86;--berry:#E58E8E;--line:#43503C;--w1:rgba(120,160,100,.14);--w2:rgba(100,140,180,.14);--w3:rgba(180,140,80,.10)}}
:root[data-theme="dark"]{--bg:#1B211A;--card:#242C22;--ink:#EDE7D6;--mute:#A9AE9A;--moss:#9BBF86;--moss-d:#C5DDB4;--moss2:#2F3A2B;--bark:#D2AE86;--berry:#E58E8E;--line:#43503C;--w1:rgba(120,160,100,.14);--w2:rgba(100,140,180,.14);--w3:rgba(180,140,80,.10)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;background:radial-gradient(ellipse 70% 45% at 0% 0%,var(--w1),transparent 70%),radial-gradient(ellipse 60% 45% at 100% 6%,var(--w2),transparent 70%),radial-gradient(ellipse 70% 45% at 100% 100%,var(--w3),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-family:Fredoka,"Baloo 2",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.2;color:var(--bark)}
header{padding:14px 16px 0;max-width:880px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;color:var(--moss)}
.brand h1{font-size:1.7rem;letter-spacing:.01em}
.sprig{flex:none}.sprig.flip{transform:scaleX(-1)}
.ribbon{display:flex;justify-content:center;margin:8px 0 0}
.ribbon span{background:var(--moss2);color:var(--moss-d);font:600 .95rem Fredoka,system-ui,sans-serif;padding:5px 34px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%)}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}
textarea{width:100%}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:4px 16px 12px;scrollbar-width:none;border-bottom:1.5px dashed var(--line)}
nav button{background:transparent;border:1.5px dashed var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 .9rem Nunito,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--moss2);border:1.5px solid var(--moss);color:var(--moss-d)}
main{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1.6px dashed var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h3{font-size:1.2rem;margin-bottom:6px}
.sub{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
.btn{background:var(--moss);color:var(--card);border:0;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--moss2);color:var(--ink)}
.btn.bad{background:none;color:var(--berry);padding:4px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.track{background:var(--moss2);border-radius:14px;padding:12px}
.track b{display:block;margin-bottom:4px;font-family:Fredoka,system-ui,sans-serif;font-weight:600;color:var(--moss-d)}
.track ul{margin:0;padding:0;list-style:none}
.track li{position:relative;padding-left:22px;margin:3px 0}
.track li::before{content:"";position:absolute;left:2px;top:.42em;width:12px;height:12px;background:var(--moss);border-radius:0 80% 0 80%;transform:rotate(-8deg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.item{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1.5px dashed var(--line)}
.item label{flex:1}
.item.done label{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--moss)}
.bar{height:12px;background:var(--moss2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);transition:width .4s}
.tag{background:var(--moss2);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px}
.empty{text-align:center;color:var(--mute);padding:22px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
dt{font-weight:700;color:var(--bark)}dd{margin:0}
.big{font-size:2rem;filter:saturate(.7)}
#modal{position:fixed;inset:0;background:rgba(40,34,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
#modal .card{max-width:420px;width:100%;max-height:90vh;overflow:auto;margin:0}
.pcard{background:#FFFDF6;color:#3B3226;border:1.5px dashed #BFB08A;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:430px}
.pcard .ph{padding:12px 14px 4px;text-align:center}
.pcard .rb{display:block;color:#fff;font:600 1.05rem Fredoka,system-ui,sans-serif;padding:5px 26px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%)}
.pcard .st{display:block;font-size:.8rem;font-weight:700;margin-top:4px}
.pcard .pb{padding:4px 14px 10px;display:flex;flex-direction:column;flex:1;gap:6px;font-size:.85rem}
.pcard .chip{align-self:flex-start;border-radius:99px;padding:1px 10px;font-size:.7rem;font-weight:700}
.pcard h4{margin:2px 0 0;font:600 1.1rem Fredoka,system-ui,sans-serif;color:#3B3226}
.pcard .lab{font-size:.62rem;font-weight:800;color:#6E6552;letter-spacing:.04em}
.pcard .try{background:#F3F0E0;border:1.3px dashed;border-radius:12px;padding:6px 9px}
.pcard .safe{color:#A04848;font-weight:700;font-size:.72rem}
.pcard .draw{flex:1;min-height:40px;border:1.3px dashed #BFB08A;border-radius:12px;font-size:.65rem;font-style:italic;color:#9A8F76;padding:3px 7px}
.pcard .wl{font-size:.65rem;color:#6E6552;display:flex;gap:6px;align-items:flex-end;margin-top:2px}
.pcard .wl i{flex:1;border-bottom:1px solid #8A7F66;height:12px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.chk{display:inline-flex;gap:6px;align-items:center;margin:3px 12px 3px 0}

const CARDS=[{"n":"Beach","c":"#4D7A99","s":[{"n":"Rock pools","l":[{"t":"Peek in a pool","f":"Rock pools are small puddles of sea water left behind on the rocks when the tide goes out. Tiny crabs, snails and sea anemones live there.","y":"Look with your eyes first. Touch gently with one finger. Put every animal back where you found it.","s":"Stay within arm's reach of a grown-up near water."},{"t":"Hold on tight!","f":"Limpets clamp onto rock, mussels glue themselves down with thin threads, and anemones close up when the tide leaves so they do not dry out.","y":"Draw a rock pool and label three animals. How does each one hold on or hide?","s":""},{"t":"Zones of the shore","f":"The shore has bands from the dry high-tide line down to the low-tide line. Animals live in the band where they can cope with being wet or dry.","y":"Sketch a line from dry rocks to the water and place each animal you find in the right band.","s":""},{"t":"Count the life","f":"Scientists check how healthy a shore is by counting species inside fixed squares (quadrats) at set heights, then repeating it over the years.","y":"Run a quadrat survey at two shore heights and compare them with a diversity index.","s":""}]},{"n":"Tides and waves","l":[{"t":"In and out","f":"The sea comes in and goes out. It happens twice a day at our beaches.","y":"Draw a line in the sand at the water's edge. Check it again later. What changed?","s":"Watch for big waves. Never turn your back on the sea."},{"t":"The moon's pull","f":"The moon pulls on the sea and makes tides. High tide to low tide takes about six hours.","y":"Read a tide table for your beach and mark this week's high tides on a chart.","s":""},{"t":"Big tides, small tides","f":"Spring tides are the biggest and happen around full and new moon. Neap tides are the smallest and happen at the quarter moons.","y":"Compare a month of tide heights with the moon phases and find the pattern.","s":""},{"t":"Why places differ","f":"Tides come from the moon and sun's gravity, but the shape of the coast and sea floor makes tide range differ from place to place.","y":"Compare tide tables from two ports and explain why their ranges differ.","s":""}]},{"n":"Shells and shore animals","l":[{"t":"Shell sort","f":"Every shell was once a home for a soft animal. Empty shells wash up on the beach.","y":"Collect a few empty shells and sort them by size, shape or colour.","s":"Take only empty shells. Leave living animals alone."},{"t":"Who makes shells?","f":"Soft-bodied animals called molluscs build shells from minerals in sea water. Snail shells are one piece. Mussel shells have two halves.","y":"Sort your shells into one-piece and two-piece. Which group has more?","s":""},{"t":"Growth lines","f":"Many shells show growth lines. The animal adds new shell at the edge as it grows bigger.","y":"Measure five shells of one kind and graph their sizes. Count the growth lines.","s":""},{"t":"A sourer sea","f":"The sea absorbs carbon dioxide from the air and becomes slightly more acidic. This makes it harder for shell-builders to form shells.","y":"Put an eggshell or chalk in vinegar and watch it fizz. Discuss what the model leaves out.","s":"Adult supervision for the experiment."}]}]},{"n":"Night Sky","c":"#444F7C","s":[{"n":"The Moon","l":[{"t":"Moon watch","f":"The moon changes shape. Sometimes it is round and sometimes a thin curve.","y":"Look for the moon tonight. Draw what you see.","s":""},{"t":"Borrowed light","f":"The moon has no light of its own. It reflects sunlight. We see more or less of the lit part as it travels around Earth, about every 29 days.","y":"Draw the moon each night for a week and look for the pattern.","s":""},{"t":"Phases","f":"Waxing means growing and waning means shrinking. In the southern hemisphere a waxing crescent is lit on the left side.","y":"Use a torch and a ball in a dark room to model the phases. Record the real moon for a month.","s":""},{"t":"One face only","f":"The moon always shows us the same face because it spins once for every trip around Earth. This is called tidal locking.","y":"Walk around a chair while keeping your face towards it. How many times do you turn?","s":""}]},{"n":"Stars and patterns","l":[{"t":"Star counting","f":"Stars are suns that are very far away. On a dark night we can see many of them.","y":"Lie on a blanket and count to ten stars.","s":""},{"t":"Southern Cross","f":"The Southern Cross is a small group of four bright stars. Its long arm points roughly towards south.","y":"Find it on a clear night and draw the shape.","s":""},{"t":"Find south","f":"To find south, extend the long axis of the Southern Cross about four and a half times, then drop straight down to the horizon.","y":"Practise at night, then check with a compass in daylight.","s":""},{"t":"Star colours","f":"A star's colour shows its temperature. Blue-white stars are hottest and red stars are coolest. The sun is a middle-sized yellow star.","y":"Find a red star and a blue-white star. Research why they differ.","s":""}]},{"n":"Night animals","l":[{"t":"Who is awake?","f":"Some animals sleep in the day and wake at night. Owls, bats and moths are some of them.","y":"Sit quietly outside at dusk. What can you hear?","s":"Stay with a grown-up outside at night."},{"t":"Night senses","f":"Owls have big eyes and very good hearing. Small bats make squeaks and listen to the echoes to find insects.","y":"Play the echo game: one person claps, a blindfolded friend points to the sound.","s":""},{"t":"Too much light","f":"Bright outdoor lights wash out the stars and can confuse night animals.","y":"Count the stars you see with outdoor lights on and off. Record both.","s":""},{"t":"Star navigators","f":"Researchers showed that dung beetles can roll their ball in a straight line at night by using the Milky Way.","y":"Read about the experiment, then design a way to test another animal's navigation without harming it.","s":""}]}]},{"n":"Senses","c":"#A65A6E","s":[{"n":"Seeing and hearing","l":[{"t":"Listening walk","f":"We see with our eyes and hear with our ears. Close your eyes and listen.","y":"Walk outside and name every sound you hear.","s":""},{"t":"How eyes and ears work","f":"The pupil gets smaller in bright light. Sound is a shaking in the air that travels to your ear.","y":"Look at your pupils in a mirror with the light on and off. Make a tin-can telephone.","s":""},{"t":"Thunder maths","f":"Light travels much faster than sound, so you see lightning before you hear thunder. About three seconds of delay is roughly one kilometre.","y":"Practise counting seconds between a flash and a bang from a safe place indoors.","s":"Never go outside during a storm."},{"t":"Brain's guesses","f":"Your brain builds what you see and hear and makes guesses. Optical illusions show where it guesses wrong.","y":"Test three optical illusions and explain how your brain is fooled.","s":""}]},{"n":"Touch, taste and smell","l":[{"t":"Mystery bag","f":"Our hands can feel rough, smooth, soft and hard. Our nose smells and our tongue tastes.","y":"Put things in a bag. Guess each by touch. Smell herbs in jars.","s":"Check allergies before any tasting."},{"t":"Nose and tongue","f":"Taste and smell work together. Hold your nose and food tastes dull. The tongue finds five tastes: sweet, sour, salty, bitter and umami.","y":"Hold your nose and taste something with eyes closed. Can you name it?","s":"Check allergies before any tasting."},{"t":"Touch map","f":"Skin has special receptors for pressure, heat and pain. Fingertips have many more than your back.","y":"Touch two pencil points close together on a fingertip, then on an arm. Where can you feel two?","s":""},{"t":"Smell and memory","f":"Smell is processed in parts of the brain linked to memory and emotion, which is why a smell can bring a memory back.","y":"Collect five smells and ask family which memories each brings back.","s":""}]},{"n":"Animal senses","l":[{"t":"Move like me","f":"Dogs sniff, bats listen and birds see very far.","y":"Be a dog: sniff the garden. Be a bird: look for far-away things.","s":""},{"t":"Super senses","f":"A dog's sense of smell is far stronger than ours. Elephants can pick up vibrations through the ground with their feet.","y":"Lay a hand on the floor while someone stomps. Can you feel it?","s":""},{"t":"Seeing differently","f":"Bees can see ultraviolet patterns on flowers that we cannot see. Sharks can sense tiny electric fields from other animals.","y":"Invent an animal for a made-up place and explain which senses it needs.","s":""},{"t":"Echoes","f":"Bats and dolphins make sounds and read the echoes. The delay tells them how far away something is.","y":"Sound moves about 343 metres a second. If an echo returns in 0.1 seconds, how far away is the object?","s":""}]}]},{"n":"Seasons","c":"#66854A","s":[{"n":"Weather and clothes","l":[{"t":"Pick the clothes","f":"We have four seasons: summer, autumn, winter and spring. In South Africa summer is around December.","y":"Choose clothes for each season from a pile.","s":""},{"t":"Weather watcher","f":"A thermometer shows how hot or cold it is. A rain gauge measures how much rain fell.","y":"Make a rain gauge from a bottle and record it for a week.","s":""},{"t":"Weather or climate?","f":"Weather is what happens today. Climate is the long-term pattern. The Garden Route gets rain all year, but much of the Cape gets most rain in winter.","y":"Graph monthly rainfall for George and Cape Town and explain the difference.","s":""},{"t":"Rainfall zones","f":"South Africa has winter-rainfall, summer-rainfall and year-round-rainfall regions. This shapes which plants and crops grow where.","y":"Map the three zones and list a plant or crop typical of each.","s":""}]},{"n":"Plants and animals through the year","l":[{"t":"Look at leaves","f":"In different seasons plants have different leaves, flowers and fruit.","y":"Collect three leaves. Where did each come from?","s":""},{"t":"Seasonal visitors","f":"Southern right whales visit our coast in winter and spring. Swallows arrive from the north in summer.","y":"Make a seasonal nature calendar and add what you see each month.","s":""},{"t":"Nature diary","f":"Recording when events happen, like the first flowers or bird arrivals, is called phenology.","y":"Keep a phenology log for a full year.","s":""},{"t":"Signs of change","f":"Long-term records of when nature events happen show how the climate is changing.","y":"Join a citizen science project and log sightings for a season.","s":""}]},{"n":"Why we have seasons","l":[{"t":"Long days, short days","f":"In summer the sun stays up for longer. In winter the days are shorter.","y":"Notice when it gets dark in summer and in winter.","s":""},{"t":"Shadow measure","f":"The sun is higher in the sky in summer, so shadows are shorter at midday.","y":"Measure your shadow at midday once a month and compare.","s":""},{"t":"A tilted Earth","f":"Seasons happen because Earth is tilted, not because it is closer to the sun. The southern hemisphere leans towards the sun in December.","y":"Use a lamp and a tilted ball or orange to model a year.","s":"A torch is safer than a hot lamp."},{"t":"Far from the equator","f":"Seasons are stronger further from the equator. Near the equator day length changes very little.","y":"Graph day length through the year for George and for a far northern city.","s":""}]}]},{"n":"Solar System","c":"#B5702F","s":[{"n":"Sun and Earth","l":[{"t":"Shadow tracing","f":"The sun is a star. It gives us light and warmth.","y":"Trace a friend's shadow with chalk in the morning and again later.","s":"Never look directly at the sun."},{"t":"Our star","f":"The sun is about 150 million kilometres away. Its light takes about eight minutes to reach us.","y":"Make a scale model with a big ball for the sun and a pea for Earth.","s":"Never look directly at the sun."},{"t":"Inside the sun","f":"The sun shines because hydrogen is squeezed into helium in its core, releasing huge amounts of energy.","y":"Research and draw the layers of the sun.","s":""},{"t":"Fusion","f":"In the core, hydrogen nuclei fuse into helium and the sun turns about four million tonnes of matter into energy every second.","y":"Research and explain in simple words what E = mc squared means.","s":""}]},{"n":"Planets","l":[{"t":"Big and small","f":"Our solar system has eight planets. We live on Earth.","y":"Line up balls from smallest to biggest.","s":""},{"t":"Three kinds","f":"Mercury, Venus, Earth and Mars are rocky. Jupiter and Saturn are gas giants. Uranus and Neptune are ice giants.","y":"Sort planet pictures into rocky, gas and ice groups.","s":""},{"t":"Hot Venus","f":"Venus is hotter than Mercury even though it is farther from the sun, because its thick carbon dioxide air traps heat.","y":"Make a data table of planet temperatures and day lengths and look for patterns.","s":""},{"t":"Other suns","f":"Thousands of planets have been found around other stars. Many are found by watching a star dim slightly as a planet crosses in front.","y":"Model it with a torch and a ball in a dark room and graph the dip in light.","s":""}]},{"n":"Space travel","l":[{"t":"Blast off!","f":"Rockets carry astronauts and satellites into space.","y":"Count down from ten and launch like a rocket.","s":""},{"t":"Push and go","f":"A rocket pushes hot gas down and the rocket goes up. This is an action and an equal reaction.","y":"Make a balloon rocket on a string and see how far it travels.","s":"Adult supervision. Keep balloons away from toddlers."},{"t":"Escape speed","f":"To leave Earth a rocket must reach about 11 kilometres per second, called escape velocity.","y":"Work out how long a rocket at that speed would take to travel 400 km.","s":""},{"t":"Southern telescopes","f":"South Africa hosts big telescopes. The Southern African Large Telescope is at Sutherland and the MeerKAT radio array is in the Karoo.","y":"Research how radio telescopes and optical telescopes see different things.","s":""}]}]},{"n":"Insects","c":"#857530","s":[{"n":"Bugs up close","l":[{"t":"Count the legs","f":"Insects have six legs. Spiders have eight, so spiders are not insects.","y":"Find a small bug and count its legs from a distance.","s":"Look, do not touch."},{"t":"Three parts","f":"An insect has a head, a thorax and an abdomen. It has two antennae and usually wings.","y":"Draw and label an insect from a picture.","s":""},{"t":"Skeleton outside","f":"Insects have a hard outer skeleton. They breathe through tiny holes called spiracles and shed their skin to grow.","y":"Draw an insect and a spider side by side and list the differences.","s":""},{"t":"So many species","f":"Insects are the most varied animal group on Earth. Beetles alone have hundreds of thousands of species.","y":"Build a simple identification key to sort ten bugs.","s":""}]},{"n":"Life cycles","l":[{"t":"Caterpillar to wings","f":"A caterpillar becomes a butterfly. It eats, rests in a chrysalis, then comes out with wings.","y":"Act out the stages with your body.","s":""},{"t":"Two kinds of growing","f":"Butterflies go egg, larva, pupa, adult. Grasshoppers and dragonflies go egg, nymph, adult.","y":"Sort pictures into the two kinds of life cycle.","s":""},{"t":"Why change shape?","f":"Larvae and adults often eat different food, so they do not compete with each other.","y":"Pick one insect and draw its full life cycle.","s":""},{"t":"Rebuilt body","f":"In complete metamorphosis the larva's body is broken down and rebuilt inside the pupa, controlled by hormones.","y":"Research and present how hormones control metamorphosis.","s":""}]},{"n":"Helpers","l":[{"t":"Bee visit","f":"Bees visit flowers to drink nectar. Look for them on sunny days.","y":"Watch a flower for five minutes. Who visits it?","s":"Bees can sting. Stay calm and still."},{"t":"Carriers of pollen","f":"Pollen sticks to a bee and is carried from flower to flower. This is pollination and it helps many fruits and nuts form.","y":"Count insects visiting a flower patch in ten minutes.","s":""},{"t":"Clean-up crew","f":"Dung beetles bury dung, returning nutrients to the soil and cleaning the veld. Many insects break down dead plants.","y":"Look under a log for decomposers and draw them.","s":"Wash hands afterwards."},{"t":"Insect decline","f":"Many insect numbers are falling because of habitat loss and pesticides, which also affects pollination.","y":"Design an insect-friendly garden using local plants.","s":""}]}]},{"n":"Who Eats What","c":"#7A5236","s":[{"n":"Diets","l":[{"t":"Plants or meat?","f":"Herbivores eat plants, carnivores eat meat and omnivores eat both. We are omnivores.","y":"Sort toy animals into three groups.","s":""},{"t":"What the words mean","f":"Herbivore means plant eater, carnivore means meat eater and omnivore means eats everything.","y":"Sort animal pictures and then list what you ate today.","s":""},{"t":"More diet words","f":"Insectivores eat insects, frugivores eat fruit and scavengers eat dead animals. Some animals, like hyenas, hunt and scavenge.","y":"Classify 15 animals from a game reserve. Which do not fit neatly?","s":""},{"t":"Digesting plants","f":"Cows and antelope have multi-chambered stomachs where microbes ferment tough plant food. Carnivores have shorter simpler guts.","y":"Draw and compare the digestive systems of a cow, a lion and a human.","s":""}]},{"n":"Food chains","l":[{"t":"Who eats who?","f":"Sun, grass, zebra, lion. Each one gives food to the next.","y":"Put the picture cards in order to build a chain.","s":""},{"t":"Makers and eaters","f":"Plants make their own food from sunlight. Animals eat them. Decomposers like fungi, worms and dung beetles break down what dies.","y":"Draw a food chain from a rock pool or a fynbos patch.","s":""},{"t":"Webs and energy","f":"Real food chains link into webs. Roughly ten percent of the energy passes up to each next level.","y":"Start with 10 000 energy units and calculate what reaches the fourth level.","s":""},{"t":"Missing predators","f":"If a top predator disappears, the animals it ate can multiply and overgraze, which affects the whole system.","y":"Debate: what happens if a predator is removed from a reserve?","s":""}]},{"n":"Teeth and eyes","l":[{"t":"My teeth","f":"Look at your teeth in a mirror. Some are flat and some are pointy.","y":"Smile and count your teeth.","s":""},{"t":"Tear or grind","f":"Meat eaters have sharp pointed teeth for tearing. Plant eaters have flat teeth for grinding. We have both.","y":"Find the pointy and flat teeth in your own mouth.","s":""},{"t":"Eyes tell a story","f":"Predators usually have eyes at the front for judging distance. Prey animals usually have eyes at the sides to see all around.","y":"Compare how wide you can see with eyes front versus a wide-set view.","s":""},{"t":"Reading a skull","f":"Scientists read diet from teeth. Dental formulas count each tooth type in the jaw.","y":"Look at skull pictures and write the dental formula for three animals.","s":""}]}]},{"n":"How Does It Work?","c":"#5A6E7C","s":[{"n":"In the kitchen","l":[{"t":"Rise, dough!","f":"Dough gets bigger when it rests. Little yeast living things make it puff up.","y":"Watch a bowl of dough rise. Poke it gently.","s":"Wash hands before and after."},{"t":"Yeast bubbles","f":"Yeast eats sugar and breathes out carbon dioxide gas. The bubbles make bread rise. Sourdough uses wild yeast and friendly bacteria.","y":"Mark your dough jar with a rubber band and watch it grow.","s":""},{"t":"Gluten and browning","f":"Flour and water make gluten, which stretches into a net. Browning on the crust comes from the Maillard reaction between sugars and proteins in heat.","y":"Bake two loaves with different kneading times and compare them.","s":"Adult near the oven."},{"t":"Emulsions","f":"Oil and water do not mix, but egg yolk contains lecithin, an emulsifier that holds them together, as in mayonnaise.","y":"Make mayonnaise with and without yolk and explain the difference.","s":"Use pasteurised egg."}]},{"n":"Simple machines","l":[{"t":"Rolling down","f":"A ball rolls down a slope. A push or a pull makes things move.","y":"Make a ramp and roll different things down it.","s":""},{"t":"Easier lifting","f":"Levers, wheels and ramps make work easier. A see-saw is a lever.","y":"Use a ruler as a lever to lift a book.","s":""},{"t":"Pulleys","f":"A pulley lets you pull down to lift something up. More ropes make it easier but you pull a longer distance.","y":"Build a pulley and use a spring scale to compare force.","s":""},{"t":"Gears","f":"Gears change speed and force. On a bicycle, a larger front gear and smaller rear gear gives more speed but needs more effort.","y":"Count teeth on your bike gears and calculate the gear ratios.","s":""}]},{"n":"Water and power","l":[{"t":"Where does it go?","f":"Water comes in pipes to our tap and goes down the drain.","y":"Follow the water from the tap to the drain. Save water.","s":""},{"t":"The water cycle","f":"Water rises as vapour, turns back into drops as it cools and falls as rain.","y":"Put ice on a lid over a bowl of warm water and watch drops form.","s":"Adult handles the warm water."},{"t":"Circuits","f":"Electricity needs a complete loop to flow. A switch opens and closes the loop.","y":"Build a circuit with a battery, a bulb and a switch.","s":"Use small batteries only, never mains."},{"t":"Power in South Africa","f":"Most South African electricity comes from coal, with growing wind and solar. A circuit follows V = I times R.","y":"Build series and parallel circuits and measure with a multimeter.","s":"Use small batteries only, never mains."}]}]}];

 $('view').innerHTML=({home,together,guides,signs,zulu,cards:cardsTab,planner,kitchen,milestones,diary,portfolio})[tab]();
}
/* Home */
const INSIDE=[['Nature guides','South African nature cards from toddler to teen','guides'],['Sign language','Signs by stage, with tick-offs','signs'],['isiZulu','Word lists to learn together','zulu'],['Print cards','8 themes, 24 subtopics, 96 cards','cards'],['Planner','Plan the week and print it','planner'],['Kitchen list','Shopping grouped by recipe','kitchen'],['Milestones','A gentle guide for each stage','milestones'],['Diary','Notes, photos and voice recordings','diary']];
const mixc=(a,b,t)=>{const q=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=q(a),B=q(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function home(){return `<section class="hero"><div class="hero-in"><h2>Woodland Journey</h2><div class="ribbon"><span>Our nature, kitchen and learning journal</span></div><p>Nature, language, cooking and making for curious little explorers, from toddler to teen.</p><div class="row cta"><button class="btn" onclick="go('together')">Pick a theme</button><button class="btn alt" onclick="go('cards')">Print cards</button>${S.kids.length?'':'<button class="btn alt" onclick="kidsDlg()">Add children</button>'}</div></div></section>
<div class="card"><h3>What's inside</h3><div class="inc">${INSIDE.map(([t,d,g])=>`<button class="inc-i" onclick="go('${g}')"><b>${t}</b><span>${d}</span></button>`).join('')}</div></div>
<div class="row pills"><span class="tag">Made for homeschooling</span><span class="tag">Toddler to teen</span><span class="tag">Print and use</span><span class="tag">Saved on your device</span></div>`}
/* Together */
function together(){return `<p class="sub">One theme, two tracks, so everyone works side by side. Add either track to ${esc(kid().name)}'s planner.</p>`+THEMES.map((t,i)=>`
<div class="card"><div class="row sp"><h3>${t.h}</h3><span class="big">${t.ic}</span></div>
<div class="two"><div class="track"><b>Older</b><ul>${t.o.map(x=>`<li>${x}</li>`).join('')}</ul>${planSel(t.h+' (older)')}</div>
<div class="track"><b>Toddler</b><ul>${t.y.map(x=>`<li>${x}</li>`).join('')}</ul>${planSel(t.h+' (toddler)')}</div></div></div>`).join('')}
function planSel(t){return `<select style="margin-top:8px;width:100%" onchange="addPlan(this.value,'${esc(t).replace(/'/g,'&#39;')}');this.value=''"><option value="">Add to planner…</option>${DAYS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>`}
function addPlan(day,t){if(!day)return;const k=kid().id;((S.planner[k]??={})[day]??=[]).push({id:uid(),t,done:false});save();render()}
/* Guides */
let gst=null,sgl=null;
const stageOpts=s=>Object.entries(STAGES).map(([a,b])=>`<option value="${a}" ${a===s?'selected':''}>${b}</option>`).join('');
function guides(){const k=kid(),st=gst||(k&&k.stage)||'pre';
 return `<div class="card"><select style="width:100%" onchange="gst=this.value;render()" aria-label="Age stage">${stageOpts(st)}</select><p class="sub">South African nature for this age. Every card has something to try outside.</p></div>`+NATURE[st].map(([ic,h,f,t])=>`<div class="card"><div class="row sp"><h3>${h}</h3><span class="big">${ic}</span></div><p>${f}</p><div class="track"><b>Try it</b>${t}</div></div>`).join('')}
function signs(){const k=kid(),st=sgl||SGMAP[k.stage],sk=((S.sign??={})[k.id]??={}),L=SIGNS[st].l,n=L.filter((_,i)=>sk[st+i]).length;
 return `<div class="card"><select style="width:100%" onchange="sgl=this.value;render()" aria-label="Sign set">${Object.entries(SIGNS).map(([a,v])=>`<option value="${a}" ${a===st?'selected':''}>${v.n}</option>`).join('')}</select>
 <div class="row sp" style="margin:12px 0 4px"><b>${esc(k.name)} knows</b><span>${n} of ${L.length}</span></div><div class="bar"><i style="width:${Math.round(n/L.length*100)}%"></i></div>
 <p class="sub">Tick a sign once they use it on their own. Text can't show movement, so check each one against a video dictionary such as <a href="https://www.handspeak.com" target="_blank" rel="noopener">Handspeak</a> or <a href="https://www.lifeprint.com" target="_blank" rel="noopener">Lifeprint</a>.</p></div>
 <div class="card">${L.map(([w,h],i)=>`<div class="item"><input type="checkbox" id="g${i}" ${sk[st+i]?'checked':''} onchange="tg('${st+i}')"><label for="g${i}"><b>${esc(w)}</b><div class="sub">${esc(h)}</div></label></div>`).join('')}</div>`}
let zl=null;
function zulu(){const k=kid(),st=zl||ZMAP[k.stage],zk=((S.zulu??={})[k.id]??={}),L=ZULU[st].l,n=L.filter((_,i)=>zk[st+i]).length;
 return `<div class="card"><select style="width:100%" onchange="zl=this.value;render()" aria-label="Word set">${Object.entries(ZULU).map(([a,v])=>`<option value="${a}" ${a===st?'selected':''}>${v.n}</option>`).join('')}</select>
 <div class="row sp" style="margin:12px 0 4px"><b>${esc(k.name)} knows</b><span>${n} of ${L.length}</span></div><div class="bar"><i style="width:${Math.round(n/L.length*100)}%"></i></div>
 <p class="sub">These are a starting list. Have a Zulu speaker in the family check every word and say it aloud so the children hear the real pronunciation. Entries marked (ask family) are gaps to fill in.</p></div>
 <div class="card">${L.map(([w,z],i)=>`<div class="item"><input type="checkbox" id="z${i}" ${zk[st+i]?'checked':''} onchange="tz('${st+i}')"><label for="z${i}"><b>${esc(z)}</b><div class="sub">${esc(w)}</div></label></div>`).join('')}</div>`}
function tz(key){const zk=S.zulu[kid().id];zk[key]=!zk[key];save();render()}
function tg(key){const sk=S.sign[kid().id];sk[key]=!sk[key];save();render()}
/* Print cards */
function ctog(k){S.cardSel=S.cardSel||{};S.cardSel[k]=!S.cardSel[k];save();render()}
function cth(ti,on){S.cardSel=S.cardSel||{};CARDS[ti].s.forEach((_,si)=>S.cardSel[ti+'-'+si]=on);save();render()}
function clv(i){const a=S.cardLv||[],j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);S.cardLv=a.sort();save();render()}
function cmatch(){const u=new Set();S.kids.forEach(k=>(LVMAP[k.stage]||[]).forEach(x=>u.add(x)));S.cardLv=[...u].sort();save();render()}
function pcard(t,sub,li,c){const d=t.s[sub].l[li],col=t.c;
 return `<div class="pcard"><div class="ph"><span class="rb" style="background:${mixc(col,'#FFFDF6',.66)};color:${mixc(col,'#000000',.38)}">${esc(t.n)}</span><span class="st" style="color:${mixc(col,'#000000',.2)}">${esc(t.s[sub].n)}</span></div><div class="pb"><span class="chip" style="background:${CCH[li]};color:#1F2A24">${esc(CLV[li])}</span><h4>${esc(d.t)}</h4><div class="lab">DID YOU KNOW</div><div>${esc(d.f)}</div><div class="try" style="border-color:${col}"><div class="lab" style="color:${col}">TRY IT</div>${esc(d.y)}</div>${d.s?`<div class="safe">Safety: ${esc(d.s)}</div>`:''}<div class="draw">Draw it or stick a photo here</div><div class="wl">isiZulu: <i></i> Sign: <i></i></div><div class="wl">Source / checked by: <i></i></div></div></div>`}
function cardsTab(){document.body.classList.add('pc');
 const k=kid();if(!S.cardLv)S.cardLv=k?(LVMAP[k.stage]||[0]).slice():[0,1,2,3];
 const sel=S.cardSel||{},L=S.cardLv;let subs=[];
 CARDS.forEach((t,ti)=>t.s.forEach((_,si)=>{if(sel[ti+'-'+si])subs.push([ti,si])}));
 const cards=[];subs.forEach(([ti,si])=>L.forEach(li=>cards.push([ti,si,li])));
 let sheets='';for(let i=0;i<cards.length;i+=4)sheets+=`<div class="sheet">${cards.slice(i,i+4).map(([ti,si,li])=>pcard(CARDS[ti],si,li)).join('')}</div>`;
 return `<div class="card noprint"><h3>Print cards</h3><p class="sub">Tick the subtopics and stages you want, then print. Cards print 4 to an A4 page at 100 percent. Cut on the dotted lines.</p>
 <div><b>Stages</b> <button class="btn alt" onclick="cmatch()" style="margin-left:6px">Match my children</button><div>${CLV.map((n,i)=>`<label class="chk"><input type="checkbox" ${L.includes(i)?'checked':''} onchange="clv(${i})">${esc(n)}</label>`).join('')}</div></div>
 ${CARDS.map((t,ti)=>`<div style="margin-top:12px"><div class="row"><b style="color:var(--bark)">${esc(t.n)}</b><button class="btn bad" onclick="cth(${ti},true)">All</button><button class="btn bad" onclick="cth(${ti},false)">None</button></div><div>${t.s.map((s,si)=>`<label class="chk"><input type="checkbox" ${sel[ti+'-'+si]?'checked':''} onchange="ctog('${ti}-${si}')">${esc(s.n)}</label>`).join('')}</div></div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn" onclick="print()" ${cards.length?'':'disabled'}>Print ${cards.length} cards (${Math.ceil(cards.length/4)} pages)</button></div>
 <p class="sub">Draft content: check every fact before printing or sharing. If printing does not open on your device, use the PDF card pack instead.</p></div>`+(cards.length?sheets:'<div class="card empty noprint">Tick a subtopic above to preview its cards.</div>')}
/* Planner */
function planner(){const k=kid().id,P=S.planner[k]||{};
 return `<div class="row sp noprint"><p class="sub">Week plan for ${esc(kid().name)}</p><button class="btn alt" onclick="print()">Print week</button></div>`+DAYS.map(([d,l])=>{const L=P[d]||[];
 return `<div class="card"><h3>${l}</h3>${L.map(x=>`<div class="item ${x.done?'done':''}"><input type="checkbox" id="p${x.id}" ${x.done?'checked':''} onchange="tp('${d}','${x.id}')"><label for="p${x.id}">${esc(x.t)}</label><button class="btn bad noprint" aria-label="Remove" onclick="rp('${d}','${x.id}')">✕</button></div>`).join('')||'<div class="sub">Nothing planned</div>'}
 <form class="row noprint" style="margin-top:8px" onsubmit="event.preventDefault();addPlan('${d}',this.t.value.trim());">${''}<input type="text" name="t" placeholder="Add a task" style="flex:1" required><button class="btn">Add</button></form></div>`}).join('')}
function tp(d,id){const x=S.planner[kid().id][d].find(y=>y.id===id);x.done=!x.done;save();render()}
function rp(d,id){const a=S.planner[kid().id][d];a.splice(a.findIndex(y=>y.id===id),1);save();render()}
/* Kitchen */
function kitchen(){const gs=[...new Set(S.shop.map(i=>i.g))];
 return `<form class="card row" onsubmit="event.preventDefault();addShop(this)"><input type="text" name="t" placeholder="Item" style="flex:1;min-width:120px" required><input type="text" name="g" placeholder="Recipe or project" list="gl" required><datalist id="gl">${gs.map(g=>`<option value="${esc(g)}">`).join('')}</datalist><button class="btn">Add</button></form>`+
 (gs.map(g=>`<div class="card"><h3>${esc(g)}</h3>${S.shop.filter(i=>i.g===g).map(i=>`<div class="item ${i.done?'done':''}"><input type="checkbox" id="s${i.id}" ${i.done?'checked':''} onchange="ts('${i.id}')"><label for="s${i.id}">${esc(i.t)}</label><button class="btn bad" aria-label="Remove" onclick="rs('${i.id}')">✕</button></div>`).join('')}</div>`).join('')||'<div class="card empty">List is empty. Add what you need for your next bake or craft.</div>')+
 (S.shop.some(i=>i.done)?`<button class="btn alt" onclick="clearShop()">Clear ticked items</button>`:'')}
function addShop(f){S.shop.push({id:uid(),g:f.g.value.trim(),t:f.t.value.trim(),done:false});save();render()}
function ts(id){const i=S.shop.find(x=>x.id===id);i.done=!i.done;save();render()}
function rs(id){S.shop=S.shop.filter(x=>x.id!==id);save();render()}
function clearShop(){S.shop=S.shop.filter(x=>!x.done);save();render()}
/* Milestones */
let mst=null;
function milestones(){const k=kid();mst=mst||k.stage;const L=MS[mst],st=(S.ms[k.id]||{}),done=L.filter((_,i)=>st[mst+i]).length,p=Math.round(done/L.length*100);
 return `<div class="card"><select onchange="mst=this.value;render()" style="width:100%">${Object.entries(STAGES).map(([a,b])=>`<option value="${a}" ${a===mst?'selected':''}>${b}</option>`).join('')}</select>
 <div class="row sp" style="margin:12px 0 4px"><b>${esc(k.name)}</b><span>${done} of ${L.length}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>
 <div class="card">${L.map((t,i)=>`<div class="item ${st[mst+i]?'done':''}"><input type="checkbox" id="m${i}" ${st[mst+i]?'checked':''} onchange="tm('${mst+i}')"><label for="m${i}">${t}</label></div>`).join('')}</div>
 <p class="sub">Milestones are a guide, not a test. Children reach them in their own order.</p>`}
function tm(key){const k=kid().id;(S.ms[k]??={})[key]=!S.ms[k][key];save();render()}
/* Diary */
function diary(){const k=kid(),E=S.diary.filter(e=>e.kid===k.id);
 return `<form class="card" onsubmit="event.preventDefault();saveEntry(this)"><h3>New entry for ${esc(k.name)}</h3>
 <div class="row" style="margin:8px 0"><input type="text" name="title" placeholder="Title" style="flex:1;min-width:140px" required><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"><select name="tag">${TAGS.map(t=>`<option>${t}</option>`).join('')}</select></div>
 <textarea name="notes" rows="3" placeholder="What did they do, say or notice?" required></textarea>
 <div class="row" style="margin:10px 0"><button type="button" class="btn alt" id="recbtn" onclick="toggleRec()">🎙 Record voice note</button><label class="btn alt">📷 Add photos<input type="file" accept="image/*" multiple hidden onchange="addImgs(this)"></label><span class="sub" id="pstat">${pendTxt()}</span></div>
 <button class="btn">Save entry</button></form>`+
 (E.map(e=>`<div class="card"><div class="row sp"><h3>${esc(e.title)}</h3><span class="sub">${esc(e.date)}</span></div><span class="tag">${esc(e.tag)}</span><p style="white-space:pre-line">${esc(e.notes)}</p>${e.audio?`<audio controls src="${e.audio}" style="width:100%"></audio>`:''}<div class="row">${(e.imgs||[]).map(s=>`<img class="thumb" src="${s}" alt="">`).join('')}</div><button class="btn bad noprint" onclick="delEntry(${e.id})">Delete</button></div>`).join('')||'<div class="card empty">No entries yet. A voice note of your child explaining their work makes a lovely record.</div>')}
function pendTxt(){return[pend.audio?'Voice note ready':'',pend.imgs.length?pend.imgs.length+' photo(s)':''].filter(Boolean).join(' · ')}
async function toggleRec(){
 if(rec&&rec.state==='recording'){rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder){alert('Recording is not supported in this browser.');return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(s);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());clearTimeout(rec._t);const r=new FileReader();r.onload=()=>{pend.audio=r.result;$('recbtn').textContent='🎙 Record again';$('pstat').textContent=pendTxt()};r.readAsDataURL(new Blob(ch,{type:rec.mimeType}))};
  rec.start();rec._t=setTimeout(()=>rec.state==='recording'&&rec.stop(),60000);$('recbtn').textContent='⏹ Stop (max 60s)'}
 catch(e){alert('Microphone blocked. Allow microphone access in your browser settings.')}}
function addImgs(inp){[...inp.files].forEach(f=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const sc=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pend.imgs.push(c.toDataURL('image/jpeg',.6));URL.revokeObjectURL(u);$('pstat').textContent=pendTxt()};im.src=u})}
function saveEntry(f){S.diary.unshift({id:Date.now(),kid:kid().id,title:f.title.value.trim(),date:f.date.value,tag:f.tag.value,notes:f.notes.value.trim(),audio:pend.audio,imgs:pend.imgs});
 if(save()){pend={audio:null,imgs:[]};render()}else S.diary.shift()}
function delEntry(id){if(confirm('Delete this entry?')){S.diary=S.diary.filter(e=>e.id!==id);save();render()}}
/* Portfolio */
let rs0=new Date(Date.now()-30*864e5).toISOString().slice(0,10),re0=new Date().toISOString().slice(0,10);
function portfolio(){const k=kid(),E=S.diary.filter(e=>e.kid===k.id&&e.date>=rs0&&e.date<=re0).sort((a,b)=>a.date<b.date?-1:1),st=S.ms[k.id]||{},done=Object.values(st).filter(Boolean).length;
 return `<div class="card noprint"><div class="row"><label>From <input type="date" value="${rs0}" onchange="rs0=this.value;render()"></label><label>To <input type="date" value="${re0}" onchange="re0=this.value;render()"></label><button class="btn" onclick="print()">Print / save PDF</button></div>
 <div class="row" style="margin-top:10px"><button class="btn alt" onclick="exportData()">Backup</button><label class="btn alt">Restore<input type="file" accept=".json" hidden onchange="importData(this)"></label></div>
 <p class="sub">Backup saves everything to a file you can restore on another device. Do this regularly: browser storage can be cleared.</p></div>
 <div class="card"><h2>${esc(k.name)}: learning record</h2><p class="sub">${esc(rs0)} to ${esc(re0)} · ${E.length} entries · ${done} milestones ticked in total</p>
 ${E.map(e=>`<div class="item" style="display:block"><b>${esc(e.title)}</b> <span class="sub">${esc(e.date)} · ${esc(e.tag)}</span><div>${esc(e.notes)}</div><div class="row">${(e.imgs||[]).slice(0,4).map(s=>`<img class="thumb" src="${s}" alt="">`).join('')}</div></div>`).join('')||'<div class="empty">No entries in this range.</div>'}</div>`}
async function exportData(){const name='woodland-backup-'+new Date().toISOString().slice(0,10)+'.json',json=JSON.stringify(S);
 try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:json});return}}
 catch(e){if(e&&e.code==='declined')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click()}catch(e){alert('Backup could not be saved here.')}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.kids))throw 0;if(!confirm('Replace everything on this device with the backup?'))return;S=d;save();render()}catch(e){alert('That file is not a Woodland Journey backup.')}};r.readAsText(f)}
/* Children dialog */
function kidsDlg(){$('mbody').innerHTML=`<h3>Children</h3>${S.kids.map(k=>`<div class="item"><label>${esc(k.name)}<div class="sub">${STAGES[k.stage]}</div></label><button class="btn bad" onclick="delKid('${k.id}')">Remove</button></div>`).join('')||'<p class="sub">No children yet.</p>'}
 <form onsubmit="event.preventDefault();addKid(this)" style="margin-top:12px"><input type="text" name="n" placeholder="Name" required style="width:100%;margin-bottom:8px"><select name="s" style="width:100%;margin-bottom:10px">${Object.entries(STAGES).map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select><div class="row sp"><button class="btn">Add child</button><button type="button" class="btn alt" onclick="$('modal').classList.remove('on')">Done</button></div></form>`;$('modal').classList.add('on')}
function addKid(f){const k={id:uid(),name:f.n.value.trim(),stage:f.s.value};S.kids.push(k);S.active=k.id;mst=null;save();render();kidsDlg()}
function delKid(id){if(!confirm('Remove this child and all their entries?'))return;S.kids=S.kids.filter(k=>k.id!==id);S.diary=S.diary.filter(e=>e.kid!==id);delete S.planner[id];delete S.ms[id];S.active=S.kids[0]?.id||null;mst=null;save();render();kidsDlg()}
render();
</script>
</body>
</html>
